name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    if: github.event.repository.private == false
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libasound2-dev libfontconfig1-dev libfreetype-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libgl1-mesa-dev fonts-dejavu-core xvfb xauth
      - name: Build, test calculations and render the GUI
        run: python Tools/ci_build.py
      - name: Prepare the project website
        if: runner.os == 'Linux'
        env:
          PROJECT_REPOSITORY: ${{ github.repository }}
        run: python Tools/prepare_site.py --repository "$PROJECT_REPOSITORY"
      # Test results stay in the free job logs. No paid artifact/cache storage.
